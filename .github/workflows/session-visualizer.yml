name: Session Visualizer install
on:
  push:
    paths: ['Formula/session-visualizer.rb', '.github/workflows/session-visualizer.yml']
  pull_request:
    paths: ['Formula/session-visualizer.rb', '.github/workflows/session-visualizer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and test the hosted release
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -x
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap 0merUfuk/thematrix
          # Test this checked-out formula, including pull-request changes.
          cp Formula/session-visualizer.rb "$(brew --repository 0merUfuk/thematrix)/Formula/session-visualizer.rb"
          brew install --verbose 0merUfuk/thematrix/session-visualizer
          session-visualizer --version
          brew test 0merUfuk/thematrix/session-visualizer
          brew reinstall 0merUfuk/thematrix/session-visualizer
          brew uninstall --force 0merUfuk/thematrix/session-visualizer
